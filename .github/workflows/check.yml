name: 校验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 环境与素材校验
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 提交信息校验需要完整历史
          fetch-depth: 0

      - name: 配置环境并自检
        run: bash scripts/setup.sh

      - name: 校验图标素材组织
        run: bash scripts/check-index.sh

      - name: 校验 SVG 语法
        run: bash scripts/check-svg.sh

      - name: 校验浏览页与素材同步
        run: |
          set -euo pipefail
          python3 scripts/build-gallery.py
          if ! git diff --quiet -- index.html; then
            echo "✖ index.html 与 icons/ 不同步，请在本地执行 python3 scripts/build-gallery.py 后提交。" >&2
            git diff --stat -- index.html >&2
            exit 1
          fi
          echo "✔ index.html 与素材一致"

      - name: 校验 dist 与 sprite 生成
        run: |
          set -euo pipefail
          python3 scripts/build-dist.py
          python3 scripts/build-sprite.py

          # 期望值取自源素材，避免每加一批图标就要改数字
          want_icons=$(find icons -name '*.svg' | wc -l | tr -d ' ')
          want_sprites=$(find icons -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          n=$(find dist/icons -name '*.svg' | wc -l | tr -d ' ')
          s=$(find dist/sprites -name '*.svg' | wc -l | tr -d ' ')
          echo "dist/icons: $n 个（期望 $want_icons），dist/sprites: $s 个（期望 $want_sprites）"

          if [ "$n" != "$want_icons" ]; then
            echo "✖ dist/icons 数量与 icons 不一致：$n vs $want_icons" >&2
            exit 1
          fi
          if [ "$s" != "$want_sprites" ]; then
            echo "✖ dist/sprites 数量与 icons 目录数不一致：$s vs $want_sprites" >&2
            exit 1
          fi
          if grep -rl '#000' dist/icons >/dev/null; then
            echo "✖ dist/icons 里还有写死的黑色" >&2
            exit 1
          fi
          echo "✔ dist 与 sprite 正常"

      - name: 校验提交信息为中文
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            # 新分支首次推送，没有可比较的起点，只检查最新一条
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.event.after }}"
          fi

          echo "检查区间：$RANGE"
          bash scripts/check-commits.sh "$RANGE"
